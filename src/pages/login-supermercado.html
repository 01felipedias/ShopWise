{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ShopWise Lojista</title>
    <link rel="stylesheet" href="{% static 'styles/style.css' %}">
    <link rel="stylesheet" href="{% static 'styles/login-supermercado.css' %}">
</head>
<body>

    <header class="header-cadastro">
        <img src="{% static 'assets/img/logoshopwise.png' %}" alt="Logo ShopWise">
    </header>

    <main class="form-mercado">
        <div class="card-login">
            <h2>Login do Lojista</h2>
            <p class="subtitulo">Acesse sua conta para gerenciar produtos</p>

            <form id="lsLoginForm">

                <div class="input-group">
                    <input name="email" type="email" placeholder="E-mail comercial" required>
                </div>

                <div class="input-group">
                    <input name="senha" type="password" placeholder="Senha" required>
                </div>
                
                <button type="submit" class="btn-verde" style="width: 100%; margin-top: 1rem;">
                    Entrar
                </button>

            </form>

            <div class="bottom-links">
                <a href="cadastromercado.html">Não tem conta? Cadastre seu supermercado</a>
            </div>
        </div>
    </main>

    <script src="{% static 'utils/login-supermercado.js' %}"></script>
</body>
</html>

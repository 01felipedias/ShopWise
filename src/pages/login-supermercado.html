<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ShopWise Supermercado</title>
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/login-supermercado.css">
</head>
<body>

    <header class="header-cadastro">
        <img src="../assets/img/logoshopwise.png" alt="Logo ShopWise">
    </header>

    <main class="form-mercado">
        <div class="card-login">
            <h2>Login do Supermercado</h2>
            <p class="subtitulo">Acesse sua conta para gerenciar produtos</p>

            <form data-shopwise-login data-tipo="supermercado" data-destino="manter-produtos.html">
                <div class="input-group">
                    <input type="text" name="username" placeholder="E-mail comercial" aria-label="E-mail comercial (ou usuário antigo)" autocomplete="username" required>
                </div>
                <div class="input-group">
                    <input type="password" name="password" placeholder="Senha" aria-label="Senha" autocomplete="current-password" required>
                </div>

                <p class="login-message" role="alert" aria-live="polite"></p>
                <button type="submit" class="btn-verde" style="width: 100%; margin-top: 1rem;">
                    Entrar
                </button>
            </form>

            <div class="bottom-links">
                <a href="cadastromercado.html">Não tem conta? Cadastre seu supermercado</a>
            </div>
        </div>
    </main>

    <script src="../utils/login.js"></script>
</body>
</html>

{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopWise - Carrinho</title>

    <link rel="stylesheet" href="{% static 'styles/feed.css' %}">
</head>

<body>
    <div class="app-layout">
        
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-logo">
                <div class="sidebar-toggle-btn" id="desktopMenuToggle" role="button" tabindex="0" aria-label="Alternar menu lateral">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </div>
                <a href="feedproduto.html" aria-label="Ir para a página inicial">
                    <img src="{% static 'assets/img/logoshopwise.png' %}" alt="ShopWise" class="sidebar-full-logo" onerror="this.onerror=null; this.src='https://placehold.co/120x35/2ECC71/ffffff?text=ShopWise';">
                </a>
            </div>

            <nav class="sidebar-nav">
                <a href="feedproduto.html" class="nav-item active" aria-label="Página Inicial">
                    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                    <span>Início</span>
                </a>
                
                <a href="AlertaPreco.html" class="nav-item" aria-label="Seus Alertas">
                    <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                    <span>Alertas</span>
                </a>

                <a href="perfil.html" class="nav-item" aria-label="Seu Perfil">
                    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    <span>Perfil</span>
                </a>

                <a href="cupons.html" class="nav-item" aria-label="Seu Cashback">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    <span>Cashback</span>
                </a>

                <a href="pedidos.html" class="nav-item" aria-label="Seus Pedidos">
                    <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
                    <span>Pedidos</span>
                </a>
            </nav>
        </aside>
    <div class="main-content">

        <!-- Navbar -->
        <header class="navbar">

            <div class="nav-container">

                <div class="cart-navbar">

                    <div></div>

                    <h2 class="cart-title">
                        Meu Carrinho
                    </h2>

                   <a href="feedproduto.html"class="cart-close-btn"aria-label="Fechar carrinho">
                    <svg width="24"height="24"viewBox="0 0 24 24"fill="none"stroke="currentColor"stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </a>

                </div>
            </div>
        </header>

        <main class="page-container">

            <h1 class="page-title">
                Carrinho de Compras
            </h1>

            <div class="cart-layout">

                <section class="cart-products" id="cartProducts">
                </section>

                <aside class="cart-summary">

                    <h2>Resumo do Pedido</h2>

                    <div class="summary-row">
                        <span>Subtotal</span>
                        <strong id="subtotal">R$ 0,00</strong>
                    </div>

                    <div class="summary-row">
                        <span>Entrega</span>
                        <strong>Grátis</strong>
                    </div>

                    <hr style="margin:20px 0">

                    <div class="summary-total">
                        <span>Total</span>
                        <strong id="total">R$ 0,00</strong>
                    </div>

                    <button class="btn-verde" onclick="irParaCheckout()">Realizar Pedido</button>


                </aside>

            </div>

        </main>

    </div>

</div>
<style>
.cart-products{display:flex;flex-direction:column;gap:16px}.cart-item{background:#fff;border:1px solid #e1ebe6;border-radius:16px;padding:18px;display:grid;grid-template-columns:100px 1fr auto;gap:18px;align-items:center}.cart-item img{width:100px;height:100px;object-fit:contain}.cart-controls{display:flex;align-items:center;gap:10px;margin-top:12px}.cart-controls button{width:34px;height:34px;border:1px solid #00b978;background:#fff;color:#00b978;border-radius:8px;cursor:pointer}.item-total{font-weight:800}.remove-item{border:0;background:transparent;color:#b33;cursor:pointer;margin-top:8px}.empty-cart{background:#fff;border-radius:16px;padding:30px;text-align:center}@media(max-width:800px){.cart-layout{grid-template-columns:1fr!important}.cart-item{grid-template-columns:80px 1fr}.item-total{grid-column:2}.cart-item img{width:80px;height:80px}}
</style>
<script>
let carrinho=JSON.parse(localStorage.getItem("carrinho"))||[];
const precoNumero=v=>Number(String(v??0).replace(",","."))||0;
const moeda=v=>v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
function salvar(){localStorage.setItem("carrinho",JSON.stringify(carrinho));renderizar();}
function aumentar(id){const i=carrinho.find(x=>x.id===id);if(!i)return;const e=Number(i.estoque||0);if(e&&Number(i.quantidade||0)>=e){alert("A quantidade máxima disponível desse produto já está no carrinho.");return;}i.quantidade=Number(i.quantidade||0)+1;salvar();}
function diminuir(id){const i=carrinho.find(x=>x.id===id);if(!i)return;i.quantidade=Number(i.quantidade||0)-1;if(i.quantidade<=0)carrinho=carrinho.filter(x=>x.id!==id);salvar();}
function remover(id){carrinho=carrinho.filter(x=>x.id!==id);salvar();}
function renderizar(){
 const c=document.getElementById("cartProducts");let sub=0;
 if(!carrinho.length){c.innerHTML='<div class="empty-cart"><h2>Seu carrinho está vazio</h2><p>Adicione produtos no feed para continuar.</p><a href="feedproduto.html">Voltar aos produtos</a></div>';document.getElementById("subtotal").textContent="R$ 0,00";document.getElementById("total").textContent="R$ 0,00";return;}
 c.innerHTML=carrinho.map(i=>{const p=precoNumero(i.preco),q=Number(i.quantidade||1),t=p*q;sub+=t;const mercado=i.supermercado?.nome||i.mercado||"Supermercado";const img=i.img||"https://placehold.co/120x120/f4f7f6/777?text=Sem+Imagem";return `<article class="cart-item"><img src="${img}" alt="${i.nome}"><div><h3>${i.nome}</h3><p>${mercado}</p><strong>${moeda(p)} cada</strong><div class="cart-controls"><button onclick="diminuir(${i.id})">−</button><b>${q}</b><button onclick="aumentar(${i.id})">+</button></div><button class="remove-item" onclick="remover(${i.id})">Remover</button></div><div class="item-total">${moeda(t)}</div></article>`}).join("");
 document.getElementById("subtotal").textContent=moeda(sub);document.getElementById("total").textContent=moeda(sub);
}
function irParaCheckout(){if(carrinho.length)window.location.href="checkout.html";else alert("Seu carrinho está vazio.");}
document.addEventListener("DOMContentLoaded",renderizar);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Supermercado - ShopWise</title>
    <link rel="stylesheet" href="../styles/style.css">
</head>
<body class="cadastro-page">
    <header class="header-cadastro">
        <img src="../assets/img/logoshopwise.png" alt="ShopWise">
    </header>
    <main class="form-mercado">
        <div class="card-login">
            <h2>Cadastre seu supermercado</h2>
            <p class="subtitulo">Escolha o tipo de cadastro</p>
            <nav class="cadastro-tipos" aria-label="Tipo de conta">
                <a href="cadastrousuario.html">Cliente</a>
                <a href="cadastromercado.html" class="active" aria-current="page">Supermercado</a>
            </nav>
            <form data-shopwise-cadastro data-tipo="supermercado" data-destino="login-supermercado.html">
                <div class="input-group">
                    <label class="cadastro-label" for="cadastroNome">Nome do responsável *</label>
                    <input id="cadastroNome" name="nome" type="text" maxlength="150" placeholder="Ex: Jorge" autocomplete="name" required>
                </div>
                <div class="input-group">
                    <label class="cadastro-label" for="cadastroEmail">E-mail *</label>
                    <input id="cadastroEmail" name="email" type="email" placeholder="Ex: contato@example.com" autocomplete="email" required>
                </div>
                <div class="input-group">
                    <label class="cadastro-label" for="cadastroMercadoNome">Nome do supermercado *</label>
                    <input id="cadastroMercadoNome" name="supermercado_nome" type="text" maxlength="100" placeholder="Ex: Jorge Super" required>
                </div>
                <div class="input-group">
                    <label class="cadastro-label" for="cadastroMercadoEndereco">Endereço do supermercado *</label>
                    <input id="cadastroMercadoEndereco" name="supermercado_endereco" type="text" maxlength="200" placeholder="Ex: Rua Exemplo, 100" required>
                </div>
                <div class="cadastro-senhas">
                    <div class="input-group">
                        <label class="cadastro-label" for="cadastroSenha">Senha *</label>
                        <input id="cadastroSenha" name="password" type="password" placeholder="Digite uma senha" autocomplete="new-password" required>
                    </div>
                    <div class="input-group">
                        <label class="cadastro-label" for="cadastroConfirmacao">Confirme a senha *</label>
                        <input id="cadastroConfirmacao" name="confirm_password" type="password" placeholder="Repita a senha" autocomplete="new-password" required>
                    </div>
                </div>
                <p class="login-message" role="alert" aria-live="polite"></p>
                <button type="submit" class="btn-verde">Cadastrar supermercado</button>
            </form>
            <div class="bottom-links"><a href="login-supermercado.html">Já possui conta? Entrar</a></div>
        </div>
    </main>
    <script src="../utils/cadastro.js"></script>
</body>
</html>

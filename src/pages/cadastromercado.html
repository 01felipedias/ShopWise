{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Supermercado ShopWise</title>

    <link rel="stylesheet" href="{% static 'styles/style.css' %}">
</head>

<body>

    <header class="header-cadastro">
        <img src="{% static 'assets/img/logoshopwise.png' %}" alt="Logo ShopWise">
    </header>

    <main class="form-mercado">

        <div class="card-login">

            <h2>Cadastro de Supermercado</h2>
            <p class="subtitulo">
                Preencha os dados da sua loja para continuar
            </p>

           <form id="form-supermercado">

                <h3>Informações da Loja</h3>

                <div class="input-group">
                    <input name="responsavel" type="text" placeholder="Nome do responsável">
                </div>

                <div class="input-group">
                    <input name="cnpj" type="text" placeholder="CNPJ" >
                </div>

                <div class="input-group">
                    <input name="razaosocial" type="text" placeholder="Razão Social" >
                </div>

                <div class="input-group">
                    <input name="nomeloja" type="text" placeholder="Nome da Loja" >
                </div>

                <div class="input-group">
                    <input name="emailcomercial" type="email" placeholder="Email Comercial" >
                </div>
                
                <div class="input-group">
                    <input name="senha" type="password" placeholder="Senha" required>
                </div>

                <div class="input-group">
                    <input name="telefone" type="tel" placeholder="Telefone para contato" >
                </div>

                <h3>Localização da Loja</h3>

                <div class="input-group">
                    <input name="cep" type="text" placeholder="CEP" >
                </div>

                <div class="linha">
                    <input name="estado" type="text" placeholder="Estado" >
                    <input name="cidade" type="text" placeholder="Cidade" >
                </div>

                <div class="input-group">
                    <input name="bairro" type="text" placeholder="Bairro" >
                </div>

                <div class="input-group">
                    <input name="endereco" type="text" placeholder="Endereço" >
                </div>

                <div class="linha">
                    <input name="numloja" type="text" placeholder="Número" >
                    <input name="complemento" type="text" placeholder="Complemento" >
                </div>

                <button type="submit" class="btn-verde">
                    Cadastrar Supermercado
                </button>

            </form>
            <div class="bottom-links">
                <a href="login-supermercado.html">Já possui conta? Entrar</a>
            </div>
            <div style="text-align: center; margin-top: 16px;">
                    <a
                        href="login.html"
                        style="
                            color: #2ECC71;
                            text-decoration: none;
                            font-weight: 600;
                        "
                    >
                        Voltar para o login do usuário
                    </a>
            </div>
        </div>

    </main>

</body>
<script>
    const form = document.getElementById('form-supermercado');

    form.addEventListener('submit', async function(event) {
        event.preventDefault();

        const dadosSupermercado = {
            nome: form.elements['nomeloja'].value,
            responsavel: form.elements['responsavel'].value,
            cnpj: form.elements['cnpj'].value,
            razao_social: form.elements['razaosocial'].value,
            email_comercial: form.elements['emailcomercial'].value,
            senha: form.elements['senha'].value,
            telefone: form.elements['telefone'].value,
            cep: form.elements['cep'].value,
            estado: form.elements['estado'].value,
            cidade: form.elements['cidade'].value,
            bairro: form.elements['bairro'].value,
            endereco: form.elements['endereco'].value,
            numero: form.elements['numloja'].value,
            complemento: form.elements['complemento'].value
        };

        try {
            const resposta = await fetch('/api/supermercados/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(dadosSupermercado)
            });

            if (resposta.ok) {
                alert('Supermercado cadastrado com sucesso!');
                window.location.href = 'manter-produtos.html';
            } else {
                alert('Erro ao cadastrar supermercado.');
            }

        } catch (erro) {
            console.error(erro);
            alert('Não foi possível conectar com a API.');
        }
    });
</script>
</html>

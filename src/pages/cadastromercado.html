<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Supermercado - ShopWise</title>
    <link rel="stylesheet" href="../styles/style.css">
</head>
<body>
    <header class="header-cadastro">
        <img src="../assets/img/logoshopwise.png" alt="ShopWise">
    </header>
    <main class="form-mercado">
        <div class="card-login">
            <h2>Cadastre seu supermercado</h2>
            <p class="subtitulo">Escolha o tipo de cadastro</p>
            <nav class="cadastro-tipos" aria-label="Tipo de conta">
                <a href="cadastrousuario.html">Cliente</a>
                <a class="active" aria-current="page" href="cadastromercado.html">Supermercado</a>
            </nav>
            <form data-shopwise-cadastro data-tipo="supermercado" data-login="login-supermercado.html">
                <div class="input-group">
                    <label class="cadastro-label" for="nome">Nome do responsável</label>
                    <input id="nome" name="nome" type="text" maxlength="150" autocomplete="name" required>
                </div>
                <div class="input-group">
                    <label class="cadastro-label" for="email">E-mail comercial</label>
                    <input id="email" name="email" type="email" autocomplete="email" required>
                </div>
                <div class="input-group">
                    <label class="cadastro-label" for="supermercado_nome">Nome do supermercado</label>
                    <input id="supermercado_nome" name="supermercado_nome" type="text" maxlength="100" required>
                </div>
                <div class="input-group">
                    <label class="cadastro-label" for="supermercado_endereco">Endereço do supermercado</label>
                    <input id="supermercado_endereco" name="supermercado_endereco" type="text" maxlength="200" required>
                </div>
                <div class="input-group">
                    <label class="cadastro-label" for="senha">Senha</label>
                    <input id="senha" name="password" type="password" autocomplete="new-password" required>
                </div>
                <div class="input-group">
                    <label class="cadastro-label" for="confirmacao">Confirme a senha</label>
                    <input id="confirmacao" name="confirm_password" type="password" autocomplete="new-password" required>
                </div>
                <p class="login-message" role="alert" aria-live="polite"></p>
                <button type="submit" class="btn-verde">Cadastrar supermercado</button>
            </form>
            <div class="bottom-links"><a href="login-supermercado.html">Já possui conta? Entrar</a></div>
        </div>
    </main>
    <script src="../utils/mensagens-api.js?v=20261009-revisao"></script>
<script src="../utils/cadastro-api.js?v=20261009-revisao"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Cliente - ShopWise</title>
    <link rel="stylesheet" href="../styles/style.css">
</head>
<body class="cadastro-page">
    <div class="container">
        <section class="areaverde">
            <div class="areaverde-conteudo">
                <img src="../assets/img/logoshopwise.png" alt="ShopWise">
                <h1>Compare preços perto de você</h1>
                <p>Crie sua conta para entrar no ShopWise e consultar os preços dos supermercados.</p>
            </div>
        </section>
        <main class="form">
            <div class="card-login">
                <h2>Crie sua conta</h2>
                <p class="subtitulo">Escolha o tipo de cadastro</p>
                <nav class="cadastro-tipos" aria-label="Tipo de conta">
                    <a href="cadastrousuario.html" class="active" aria-current="page">Cliente</a>
                    <a href="cadastromercado.html">Supermercado</a>
                </nav>
                <form data-shopwise-cadastro data-tipo="usuario" data-destino="login.html">
                    <div class="input-group">
                        <label class="cadastro-label" for="cadastroNome">Seu nome *</label>
                        <input id="cadastroNome" name="nome" type="text" maxlength="150" placeholder="Ex: Felipe" autocomplete="name" required>
                    </div>
                    <div class="input-group">
                        <label class="cadastro-label" for="cadastroEmail">E-mail *</label>
                        <input id="cadastroEmail" name="email" type="email" placeholder="Ex: felipe@example.com" autocomplete="email" required>
                    </div>
                    <div class="input-group">
                        <label class="cadastro-label" for="cadastroSenha">Senha *</label>
                        <input id="cadastroSenha" name="password" type="password" placeholder="Digite uma senha" autocomplete="new-password" required>
                    </div>
                    <div class="input-group">
                        <label class="cadastro-label" for="cadastroConfirmacao">Confirme a senha *</label>
                        <input id="cadastroConfirmacao" name="confirm_password" type="password" placeholder="Repita a senha" autocomplete="new-password" required>
                    </div>
                    <p class="login-message" role="alert" aria-live="polite"></p>
                    <button type="submit" class="btn-verde">Cadastrar cliente</button>
                </form>
                <div class="bottom-links"><a href="login.html">Já possui conta? Entrar</a></div>
            </div>
        </main>
    </div>
    <script src="../utils/cadastro.js"></script>
</body>
</html>

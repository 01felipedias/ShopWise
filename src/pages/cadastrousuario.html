<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Cliente - ShopWise</title>
    <link rel="stylesheet" href="../styles/style.css">
</head>
<body>
    <div class="container">
        <section class="areaverde">
            <div class="areaverde-conteudo">
                <img src="../assets/img/logoshopwise.png" alt="ShopWise">
                <h1>Compare preços perto de você</h1>
                <p>Crie sua conta para consultar preços dos supermercados.</p>
            </div>
        </section>
        <main class="form">
            <div class="card-login">
                <h2>Crie sua conta</h2>
                <p class="subtitulo">Escolha o tipo de cadastro</p>
                <nav class="cadastro-tipos" aria-label="Tipo de conta">
                    <a class="active" aria-current="page" href="cadastrousuario.html">Cliente</a>
                    <a href="cadastromercado.html">Supermercado</a>
                </nav>
                <form data-shopwise-cadastro data-tipo="usuario" data-login="login.html">
                    <div class="input-group">
                        <label class="cadastro-label" for="nome">Seu nome</label>
                        <input id="nome" name="nome" type="text" maxlength="150" autocomplete="name" required>
                    </div>
                    <div class="input-group">
                        <label class="cadastro-label" for="email">E-mail</label>
                        <input id="email" name="email" type="email" autocomplete="email" required>
                    </div>
                    <div class="input-group">
                        <label class="cadastro-label" for="senha">Senha</label>
                        <input id="senha" name="password" type="password" autocomplete="new-password" required>
                    </div>
                    <div class="input-group">
                        <label class="cadastro-label" for="confirmacao">Confirme a senha</label>
                        <input id="confirmacao" name="confirm_password" type="password" autocomplete="new-password" required>
                    </div>
                    <p class="login-message" role="alert" aria-live="polite"></p>
                    <button type="submit" class="btn-verde">Cadastrar cliente</button>
                </form>
                <div class="bottom-links"><a href="login.html">Já possui conta? Entrar</a></div>
            </div>
        </main>
    </div>
    <script src="../utils/mensagens-api.js?v=20261009-revisao"></script>
<script src="../utils/cadastro-api.js?v=20261009-revisao"></script>
</body>
</html>

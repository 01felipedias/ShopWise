{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar cupons - ShopWise</title>
    <link rel="stylesheet" href="{% static 'styles/feed.css' %}">
    <link rel="stylesheet" href="{% static 'styles/manter-produtos.css' %}">
    <script src="{% static 'utils/shopwise-api.js' %}"></script>
    <style>
        .coupon-manager-layout { display:grid; grid-template-columns:minmax(0, .9fr) minmax(0, 1.25fr); gap:1.5rem; align-items:start; }
        .coupon-manager-card { min-width:0; background:#fff; border-radius:12px; padding:2rem; box-shadow:0 4px 6px rgba(0,0,0,.05); }
        .coupon-manager-card h2 { display:inline-block; margin:0 0 1.5rem; padding-bottom:.5rem; border-bottom:2px solid #2ECC71; color:#2c3e50; font-size:1.2rem; }
        .coupon-form { display:grid; gap:1rem; }
        .coupon-form label { min-width:0; display:flex; flex-direction:column; gap:.5rem; color:#444; font-size:.9rem; font-weight:600; }
        .coupon-form input:not([type="checkbox"]),.coupon-form select { width:100%; min-width:0; min-height:44px; padding:.75rem; border:1px solid #ccc; border-radius:6px; background:#fff; color:#333; font:inherit; }
        .coupon-form input:focus,.coupon-form select:focus { outline:none; border-color:#2ECC71; box-shadow:0 0 0 3px rgba(46,204,113,.2); }
        .coupon-form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:1rem; }
        .coupon-form-actions,.coupon-card-actions { display:flex; gap:.75rem; flex-wrap:wrap; }
        .coupon-action { min-height:42px; padding:.8rem 1.25rem; border:0; border-radius:6px; background:#2ECC71; color:#fff; font:inherit; font-weight:600; cursor:pointer; transition:background-color .2s; }
        .coupon-action:hover { background:#27ae60; }
        .coupon-action.secondary { background:#f1f2f6; color:#555; }
        .coupon-action.secondary:hover { background:#dfe4ea; }
        .coupon-action.danger { background:#fff0ed; color:#a33325; }
        .coupon-active-row { flex-direction:row !important; align-items:center; gap:.6rem !important; }
        .coupon-active-row[hidden] { display:none !important; }
        .coupon-active-row input { width:18px; height:18px; accent-color:#2ECC71; }
        .coupon-logout { margin-top:auto; }
        .coupon-action:disabled { opacity:.6; cursor:wait; }
        .coupon-feedback { min-height:22px; margin:0; color:#43584c; }
        .coupon-feedback.error { color:#a33325; }
        .coupon-list { display:grid; gap:12px; }
        .managed-coupon { display:grid; gap:10px; padding:15px; border:1px solid #e0ebe5; border-radius:12px; }
        .managed-coupon.inactive { opacity:.68; background:#f7f8f7; }
        .managed-coupon-heading { display:flex; justify-content:space-between; gap:12px; align-items:center; }
        .managed-coupon-heading h3 { margin:0; font-size:1rem; }
        .managed-coupon p { margin:0; color:#526359; line-height:1.45; }
        .coupon-status { border-radius:99px; padding:4px 9px; background:#e5f6eb; color:#167342; font-size:.78rem; font-weight:700; }
        .coupon-status.inactive { background:#f0f0f0; color:#666; }
        .coupon-empty { padding:22px; text-align:center; color:#64736a; border:1px dashed #cbd9d1; border-radius:12px; }
        @media(max-width:900px) { .coupon-manager-layout { grid-template-columns:1fr; } }
        @media(max-width:520px) { .coupon-form-grid { grid-template-columns:1fr; } .coupon-manager-card { padding:1.25rem; } }
    </style>
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-logo"><a href="manter-produtos.html"><img src="{% static 'assets/img/logoshopwise.png' %}" alt="ShopWise" class="sidebar-full-logo"></a></div>
            <nav class="sidebar-nav" aria-label="Navegação do lojista">
                <a href="manter-produtos.html" class="nav-item" aria-label="Visão Geral"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg><span>Visão Geral</span></a>
                <a href="manter-produtos.html" class="nav-item" aria-label="Meus Produtos"><svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg><span>Meus Produtos</span></a>
                <a href="gerenciar-cupons.html" class="nav-item active" aria-label="Cupons"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v12"></path><path d="M15 9.5A3 3 0 0 0 12 8c-1.66 0-3 .9-3 2s1.34 2 3 2 3 .9 3 2-1.34 2-3 2a3 3 0 0 1-3-1.5"></path></svg><span>Cupons</span></a>
                <a href="perfil-supermercado.html" class="nav-item" aria-label="Perfil da Loja"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span>Perfil da Loja</span></a>
                <a href="login-supermercado.html" class="nav-item coupon-logout" aria-label="Sair"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg><span>Sair</span></a>
            </nav>
        </aside>

        <main class="main-content">
          <div class="mp-container">
            <header class="mp-header">
                <h1 class="mp-title">Gerenciar cupons</h1>
                <p class="mp-subtitle">Crie ofertas para os produtos da sua loja. Os cupons antigos da plataforma continuam válidos.</p>
            </header>

            <div class="coupon-manager-layout">
            <section class="coupon-manager-card" aria-labelledby="couponFormTitle">
                <h2 id="couponFormTitle">Novo cupom</h2>
                <form class="coupon-form" id="couponForm">
                    <label for="couponCode">Código
                        <input id="couponCode" name="codigo" maxlength="50" required autocomplete="off">
                    </label>
                    <label for="couponDescription">Descrição
                        <input id="couponDescription" name="descricao" maxlength="200">
                    </label>
                    <div class="coupon-form-grid">
                        <label for="couponType">Tipo de desconto
                            <select id="couponType" name="tipo">
                                <option value="percentual">Percentual</option>
                                <option value="valor">Valor fixo</option>
                            </select>
                        </label>
                        <label for="couponValue">Desconto
                            <input id="couponValue" name="valor" type="number" min="0.01" step="0.01" required>
                        </label>
                    </div>
                    <div class="coupon-form-grid">
                        <label for="couponMinimum">Compra mínima (R$)
                            <input id="couponMinimum" name="valor_minimo" type="number" min="0" step="0.01" value="0">
                        </label>
                        <label for="couponLimit">Limite de usos
                            <input id="couponLimit" name="limite_uso" type="number" min="1" step="1" placeholder="Sem limite">
                        </label>
                    </div>
                    <div class="coupon-form-grid">
                        <label for="couponStart">Início
                            <input id="couponStart" name="data_inicio" type="datetime-local" required>
                        </label>
                        <label for="couponEnd">Fim
                            <input id="couponEnd" name="data_fim" type="datetime-local" required>
                        </label>
                    </div>
                    <label class="coupon-active-row" id="couponActiveRow" hidden>
                        <input id="couponActive" name="ativo" type="checkbox" checked> Cupom ativo
                    </label>
                    <p class="coupon-feedback" id="couponFeedback" role="status" aria-live="polite"></p>
                    <div class="coupon-form-actions">
                        <button class="coupon-action" id="couponSubmit" type="submit">Criar cupom</button>
                        <button class="coupon-action secondary" id="couponCancelEdit" type="button" hidden>Cancelar edição</button>
                    </div>
                </form>
            </section>

            <section class="coupon-manager-card" aria-labelledby="couponListTitle">
                <h2 id="couponListTitle">Cupons da sua loja</h2>
                <div class="coupon-list" id="couponList" aria-live="polite">
                    <p class="coupon-empty">Carregando cupons…</p>
                </div>
            </section>
            </div>
          </div>
        </main>
    </div>

    <script>
        const form = document.getElementById("couponForm");
        const list = document.getElementById("couponList");
        const feedback = document.getElementById("couponFeedback");
        let editingCouponId = null;
        let coupons = [];

        function escapeHtml(value) {
            return String(value ?? "").replace(/[&<>"']/g, char => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
            })[char]);
        }

        function dateForInput(value) {
            const date = new Date(value);
            const offset = date.getTimezoneOffset() * 60000;
            return new Date(date.getTime() - offset).toISOString().slice(0, 16);
        }

        function formatDate(value) {
            return new Date(value).toLocaleString("pt-BR");
        }

        async function api(url, options = {}) {
            const response = await shopwiseFetch(url, {
                ...options,
                headers: { "Content-Type": "application/json", ...(options.headers || {}) }
            });
            const data = await response.json().catch(() => ({}));
            if (response.status === 401) {
                window.location.href = "login-supermercado.html";
                throw new Error("Faça login como supermercado para gerenciar cupons.");
            }
            if (!response.ok) throw new Error(data.erro || "Não foi possível concluir a operação.");
            return data;
        }

        function renderCoupons() {
            if (!coupons.length) {
                list.innerHTML = '<p class="coupon-empty">Você ainda não cadastrou cupons.</p>';
                return;
            }

            list.innerHTML = coupons.map(coupon => {
                const benefit = coupon.tipo === "percentual"
                    ? `${escapeHtml(coupon.valor)}% de desconto`
                    : `R$ ${escapeHtml(coupon.valor)} de desconto`;
                const remaining = coupon.usos_restantes == null
                    ? `${coupon.usos} uso(s), sem limite`
                    : `${coupon.usos} de ${coupon.limite_uso} uso(s), ${coupon.usos_restantes} restante(s)`;
                return `
                    <article class="managed-coupon ${coupon.ativo ? "" : "inactive"}">
                        <div class="managed-coupon-heading">
                            <h3>${escapeHtml(coupon.codigo)} · ${benefit}</h3>
                            <span class="coupon-status ${coupon.ativo ? "" : "inactive"}">${coupon.ativo ? "Ativo" : "Desativado"}</span>
                        </div>
                        <p>${escapeHtml(coupon.descricao || "Sem descrição")}</p>
                        <p>Compra mínima: R$ ${escapeHtml(coupon.valor_minimo)} · ${remaining}</p>
                        <p>De ${formatDate(coupon.data_inicio)} até ${formatDate(coupon.data_fim)}</p>
                        <div class="coupon-card-actions">
                            <button type="button" class="coupon-action secondary" data-edit="${coupon.id}">Editar</button>
                            ${coupon.ativo ? `<button type="button" class="coupon-action danger" data-disable="${coupon.id}">Desativar</button>` : ""}
                        </div>
                    </article>`;
            }).join("");

            list.querySelectorAll("[data-edit]").forEach(button => {
                button.addEventListener("click", () => editCoupon(Number(button.dataset.edit)));
            });
            list.querySelectorAll("[data-disable]").forEach(button => {
                button.addEventListener("click", () => disableCoupon(Number(button.dataset.disable)));
            });
        }

        async function loadCoupons() {
            list.innerHTML = '<p class="coupon-empty">Carregando cupons…</p>';
            try {
                coupons = await api("/api/cupons/gerenciar/");
                renderCoupons();
            } catch (error) {
                list.innerHTML = `<p class="coupon-empty">${escapeHtml(error.message)}</p>`;
                if (feedback) showFeedback(error.message, true);
            }
        }

        function editCoupon(id) {
            const coupon = coupons.find(item => item.id === id);
            if (!coupon) return;
            editingCouponId = id;
            document.getElementById("couponFormTitle").textContent = "Editar cupom";
            document.getElementById("couponSubmit").textContent = "Salvar alterações";
            document.getElementById("couponCancelEdit").hidden = false;
            document.getElementById("couponActiveRow").hidden = false;
            form.elements.codigo.value = coupon.codigo;
            form.elements.descricao.value = coupon.descricao;
            form.elements.tipo.value = coupon.tipo;
            form.elements.valor.value = coupon.valor;
            form.elements.valor_minimo.value = coupon.valor_minimo;
            form.elements.limite_uso.value = coupon.limite_uso ?? "";
            form.elements.data_inicio.value = dateForInput(coupon.data_inicio);
            form.elements.data_fim.value = dateForInput(coupon.data_fim);
            form.elements.ativo.checked = coupon.ativo;
            form.scrollIntoView({ behavior: "smooth", block: "start" });
        }

        function resetForm() {
            editingCouponId = null;
            form.reset();
            document.getElementById("couponFormTitle").textContent = "Novo cupom";
            document.getElementById("couponSubmit").textContent = "Criar cupom";
            document.getElementById("couponCancelEdit").hidden = true;
            document.getElementById("couponActiveRow").hidden = true;
            showFeedback("");
        }

        function showFeedback(message, error = false) {
            feedback.textContent = message;
            feedback.classList.toggle("error", error);
        }

        async function disableCoupon(id) {
            if (!window.confirm("Desativar este cupom? Ele deixará de aparecer no checkout.")) return;
            try {
                await api(`/api/cupons/gerenciar/${id}/`, { method: "DELETE" });
                showFeedback("Cupom desativado.");
                await loadCoupons();
            } catch (error) {
                showFeedback(error.message, true);
            }
        }

        form.addEventListener("submit", async event => {
            event.preventDefault();
            showFeedback("");
            const formData = new FormData(form);
            const payload = Object.fromEntries(formData.entries());
            payload.codigo = payload.codigo.trim().toUpperCase();
            payload.valor = Number(payload.valor);
            payload.valor_minimo = Number(payload.valor_minimo || 0);
            payload.limite_uso = payload.limite_uso || null;
            payload.data_inicio = new Date(payload.data_inicio).toISOString();
            payload.data_fim = new Date(payload.data_fim).toISOString();
            payload.ativo = editingCouponId ? document.getElementById("couponActive").checked : true;
            const button = document.getElementById("couponSubmit");
            button.disabled = true;
            try {
                await api(
                    editingCouponId ? `/api/cupons/gerenciar/${editingCouponId}/` : "/api/cupons/gerenciar/",
                    { method: editingCouponId ? "PATCH" : "POST", body: JSON.stringify(payload) }
                );
                showFeedback(editingCouponId ? "Cupom atualizado." : "Cupom criado.");
                resetForm();
                await loadCoupons();
            } catch (error) {
                showFeedback(error.message, true);
            } finally {
                button.disabled = false;
            }
        });

        document.getElementById("couponCancelEdit").addEventListener("click", resetForm);
        loadCoupons();
    </script>
</body>
</html>

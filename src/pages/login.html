<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login de Cliente - ShopWise</title>
    <link rel="stylesheet" href="../styles/style.css">
</head>
<body>
    <div class="container">
        <section class="areaverde">
            <div class="areaverde-conteudo">
                <img src="../assets/img/logoshopwise.png" alt="ShopWise">
                <h1>Compare preços perto de você</h1>
                <p>Entre para consultar os preços dos supermercados.</p>
            </div>
        </section>
        <main class="form">
            <div class="card-login">
                <h2>Bem-vindo de volta</h2>
                <p class="subtitulo">Entre como cliente</p>
                <form data-shopwise-login data-tipo="usuario" data-destino="feedproduto.html">
                    <div class="input-group">
                        <label class="cadastro-label" for="identificador">E-mail ou usuário antigo</label>
                        <input id="identificador" name="identificador" type="text" autocomplete="username" required>
                    </div>
                    <div class="input-group">
                        <label class="cadastro-label" for="senha">Senha</label>
                        <input id="senha" name="password" type="password" autocomplete="current-password" required>
                    </div>
                    <p class="login-message" role="alert" aria-live="polite"></p>
                    <button type="submit" class="btn-verde">Entrar</button>
                </form>
                <div class="bottom-links">
                    <a href="cadastrousuario.html">Criar cadastro</a>
                    <a href="login-supermercado.html">Entrar como supermercado</a>
                </div>
            </div>
        </main>
    </div>
    <script src="../utils/mensagens-api.js?v=20261009-revisao"></script>
<script src="../utils/login-api.js?v=20261009-revisao"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopWise</title>
    <link rel="stylesheet" href="../styles/style.css">
</head>

<body>
<div class="container">

    <section class="areaverde">
        <div class="areaverde-conteudo">
            <img src="../assets/img/logoshopwise.png" alt="logo shopwise" style="margin-bottom: 20px;">
            <h1>Entre e aproveite benefícios exclusivos</h1>
            <p>
                Aplique cupons, ganhe cashback, acompanhe a variação
                de preço de um produto e receba alerta quando atingir
                o valor desejado.
            </p>
        </div>
    </section>

    <section class="form">

        <div class="card-login">

            <h2>Bem-vindo de volta</h2>
            <p class="subtitulo">Faça login para continuar</p>
            <form data-shopwise-login data-tipo="usuario" data-destino="feedproduto.html">
                <div class="input-group">
                    <input type="text" name="username" placeholder="E-mail" aria-label="E-mail (ou usuário antigo)" autocomplete="username" required>
                </div>

                <div class="input-group">
                    <input type="password" name="password" placeholder="Digite sua senha" aria-label="Senha" autocomplete="current-password" required>
                </div>

                <div class="esqueci-senha">
                    <a href="Senha.html ">Esqueceu sua senha?</a>
                </div>
                <p class="login-message" role="alert" aria-live="polite"></p>
                <button type="submit" class="btn-verde">Entrar</button>
            </form>
        
            <div class="bottom-links">
                <a href="cadastrousuario.html">Criar cadastro</a>
                <a href="cadastromercado.html">Cadastrar Supermercado</a>
            </div>
        </div>
    </section>
</div>
<script src="../utils/login.js"></script>
</body>
</html>
